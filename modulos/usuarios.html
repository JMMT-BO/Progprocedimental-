<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo Usuarios</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>

    <div class="form-container">

        <h1>Módulo Usuarios</h1>

        <div class="formulario">

            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ingrese nombre">

            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" name="apellido" placeholder="Ingrese apellido">

            <label for="tipo_documento">Tipo de Documento</label>
            <select id="tipo_documento" name="tipo_documento">
                <option>Cédula</option>
                <option>Tarjeta de Identidad</option>
                <option>Pasaporte</option>
            </select>

            <label for="numero_documento">Número de Documento</label>
            <input type="number" id="numero_documento" name="numero_documento">

            <label for="telefono">Teléfono</label>
            <input type="number" id="telefono" name="telefono">

            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email">

            <label for="genero">Género</label>
            <select id="genero" name="genero">
                <option>Masculino</option>
                <option>Femenino</option>
                <option>Otro</option>
            </select>

            <label for="cargo">Cargo</label>
            <input type="text" id="cargo" name="cargo">

            <label for="fecha_nacimiento">Fecha de Nacimiento</label>
            <input type="date" id="fecha_nacimiento" name="fecha_nacimiento">

            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" name="contrasena">

            <button type="button" id="btnGuardar">
                Guardar Usuario
            </button>

        </div>

        <a href="../index.html">
            <button type="button">Volver</button>
        </a>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../jss/usuario.js"></script>

</body>

</html>
