<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo Pedidos</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>

    <div class="form-container">

        <h1>Módulo Pedidos</h1>

        <div class="formulario">

            <label for="codigo_prodt">Código del Producto</label>
            <input type="number" id="codigo_prodt" name="codigo_prodt">

            <label for="direccion">Dirección</label>
            <input type="text" id="direccion" name="direccion">

            <label for="nombre_prodt">Nombre del Producto</label>
            <input type="text" id="nombre_prodt" name="nombre_prodt">

            <label for="metodo_pago">Método de Pago</label>
            <input type="text" id="metodo_pago" name="metodo_pago">

            <label for="nombre_usur">Nombre del Usuario</label>
            <input type="text" id="nombre_usur" name="nombre_usur">

            <label for="cantidad_prodt">Cantidad del Producto</label>
            <input type="number" id="cantidad_prodt" name="cantidad_prodt">

            <label for="Valor_Unitario">Valor a Pagar</label>
            <input type="number" id="Valor_Unitario" name="Valor_Unitario">

            <label for="telefono">Teléfono</label>
            <input type="number" id="telefono" name="telefono">

            <button id="btnGuardar" type="button">
                Guardar Pedido
            </button>

        </div>

        <a href="../index.html">
            <button type="button">Volver</button>
        </a>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../jss/pedidos.js"></script>

</body>

</html>
