<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo Inventario</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>

<div class="form-container">

    <h1>Módulo Inventario</h1>

    <div class="formulario">

        <label for="codigo_prodt">Código Producto</label>
        <input type="number" id="codigo_prodt" name="codigo_prodt">

        <label for="nombre_prodt">Nombre Producto</label>
        <input type="text" id="nombre_prodt" name="nombre_prodt">

        <label for="cantidad_prodt">Cantidad Producto</label>
        <input type="number" id="cantidad_prodt" name="cantidad_prodt">

        <label for="descripcion_prodt">Descripción Producto</label>
        <textarea id="descripcion_prodt" name="descripcion_prodt"></textarea>

        <label for="marca_prodct">Marca Producto</label>
        <input type="text" id="marca_prodct" name="marca_prodct">

        <label for="Valor_Unitario">Valor Unitario</label>
        <input type="number" id="Valor_Unitario" name="Valor_Unitario">

        <label for="categoria">Categoría Producto</label>
        <input type="text" id="categoria" name="categoria">

        <label for="ubicacion">Ubicación Producto</label>
        <input type="text" id="ubicacion" name="ubicacion">

        <button id="btnGuardar" type="button">
            Guardar Producto
        </button>

    </div>

    <a href="../index.html">
        <button type="button">Volver</button>
    </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../jss/inventario.js"></script>

</body>
</html>
